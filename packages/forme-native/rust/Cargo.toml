[package]
name = "forme-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
forme-pdf = "=0.30.0"
serde_json = "1"
harfbuzz-sys = { version = "=0.8.0", default-features = false, features = ["bundled"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
