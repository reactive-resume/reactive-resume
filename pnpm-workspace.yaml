overrides:
  # Keep plugin imports on the same Vite and Vitest instances as Vite+.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  # enriched-html pins Tiptap 3.27.1 exactly, which has published advisories (@tiptap/core <3.30.5). Its Tiptap
  # packages peer on each other's exact versions, so they move to the web app's version together.
  "react-native-enriched-html>@tiptap/core": 3.32.0
  "react-native-enriched-html>@tiptap/extension-blockquote": 3.32.0
  "react-native-enriched-html>@tiptap/extension-bold": 3.32.0
  "react-native-enriched-html>@tiptap/extension-code": 3.32.0
  "react-native-enriched-html>@tiptap/extension-document": 3.32.0
  "react-native-enriched-html>@tiptap/extension-heading": 3.32.0
  "react-native-enriched-html>@tiptap/extension-history": 3.32.0
  "react-native-enriched-html>@tiptap/extension-image": 3.32.0
  "react-native-enriched-html>@tiptap/extension-italic": 3.32.0
  "react-native-enriched-html>@tiptap/extension-link": 3.32.0
  "react-native-enriched-html>@tiptap/extension-list": 3.32.0
  "react-native-enriched-html>@tiptap/extension-paragraph": 3.32.0
  "react-native-enriched-html>@tiptap/extension-strike": 3.32.0
  "react-native-enriched-html>@tiptap/extension-text": 3.32.0
  "react-native-enriched-html>@tiptap/extension-text-align": 3.32.0
  "react-native-enriched-html>@tiptap/extension-underline": 3.32.0
  "react-native-enriched-html>@tiptap/extensions": 3.32.0
  "react-native-enriched-html>@tiptap/pm": 3.32.0
  "react-native-enriched-html>@tiptap/react": 3.32.0
  "@better-auth/infra>@better-fetch/fetch": 1.3.2
  # Keep Better Auth and its plugins on one core peer graph after infra's utils update.
  "@better-auth/utils": 0.5.1
  next@<16.3.8: 16.3.8
  "@modelcontextprotocol/client@>=2.0.0 <2.2.0": ^2.2.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  postcss@<8.5.10: ^8.5.14
  samlify@<2.13.0: ^2.13.0
  uuid@<11.1.1: ^11.1.1
  dompurify@<3.4.17: ^3.4.17
  node-forge@<1.4.1: ^1.4.2
  zod@>=4.0.0 <4.6.6: ^4.6.7
  # Expo's two plugin schemas use APIs shared with v4; dependency-security.test.mjs checks compatibility.
  "@expo/cli@58.1.17>zod": ^4.6.7
patchedDependencies:
