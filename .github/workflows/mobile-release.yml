name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, android, ios]
        default: all
      format:
        description: Store binaries (AAB/IPA), or a downloadable Android APK
        type: choice
        options: [store, apk]
        default: store
      abi:
        description: Android architecture for APK builds (ignored for store binaries)
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]
        default: arm64-v8a
      upload:
        description: Submit selected platforms directly to production after store review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  FORMAT: ${{ inputs.format }}
  ABI: ${{ inputs.abi }}
  MOBILE_UPDATE_CHANNEL: ${{ inputs.format == 'apk' && 'preview' || 'production' }}
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.release.outputs.build_number }}
      platforms: ${{ steps.release.outputs.platforms }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate request and allocate version without credentials
        id: release
        env:
          PLATFORM: ${{ inputs.platform }}
          UPLOAD: ${{ inputs.upload }}
          MOBILE_BUILD_NUMBER_BASE: ${{ vars.MOBILE_BUILD_NUMBER_BASE }}
        run: node tooling/mobile/release.ts --prepare

  build:
    needs: prepare
    environment: mobile-signing
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-12vcpu-macos-latest' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      PLATFORM: ${{ matrix.platform }}
      MOBILE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - name: Check signing file handling
        run: |
          bundle exec ruby tooling/mobile/signing_test.rb
          ruby tooling/mobile/build_test.rb
      - name: Check production distribution
        run: ruby tooling/mobile/distribution_test.rb
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: matrix.platform == 'android'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 ndk;28.2.13676358 cmake;3.22.1
      - run: pnpm install --frozen-lockfile
      - name: Check mobile source
        run: |
          pnpm --filter mobile typecheck
          pnpm --filter mobile test
      - uses: expo/expo-github-action@v9
        with:
          eas-version: 25.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Validate signing credentials after approval
        env:
          UPLOAD: "false"
          MOBILE_BUILD_NUMBER_BASE: ${{ vars.MOBILE_BUILD_NUMBER_BASE }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_BASE64 || '' }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_PASSWORD || '' }}
          IOS_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_PROVISION_PROFILE_BASE64 || '' }}
        run: node tooling/mobile/release.ts
      - name: Fetch reviewed native Forme binaries
        run: node packages/forme-native/scripts/fetch-prebuilt.mjs --platform "$PLATFORM"
      - name: Build signed binary with selected update environment
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_BASE64 || '' }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_PASSWORD || '' }}
          IOS_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_PROVISION_PROFILE_BASE64 || '' }}
        run: |
          eas env:exec "$MOBILE_UPDATE_CHANNEL" --non-interactive \
            'pnpm exec expo prebuild --platform "$PLATFORM" --clean --no-install && cd ../../tooling/mobile && if [ "$FORMAT" = apk ]; then bundle exec fastlane android build abi:"$ABI"; else bundle exec fastlane "$PLATFORM" build; fi'
      - name: Verify APK signature and architecture
        if: inputs.format == 'apk'
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/mobile-release/reactive-resume-$ABI.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          abis=$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u)
          [[ "$abis" == "$ABI" ]]
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fx "lib/$ABI/libforme_native.so" "$RUNNER_TEMP/apk-entries.txt"

      - name: Record native runtime fingerprint
        working-directory: apps/mobile
        run: |
          eas fingerprint:generate --platform "$PLATFORM" --environment "$MOBILE_UPDATE_CHANNEL" --json --non-interactive \
            > "$RUNNER_TEMP/mobile-release/fingerprint.json"
          jq -n --arg sha "$GITHUB_SHA" --arg platform "$PLATFORM" --arg build "$MOBILE_BUILD_NUMBER" \
            --arg format "$FORMAT" --arg abi "$ABI" --arg channel "$MOBILE_UPDATE_CHANNEL" \
            --arg xcode "$(if [[ "$PLATFORM" == ios ]]; then xcodebuild -version; fi)" \
            '{commit: $sha, platform: $platform, buildNumber: $build, format: $format, abi: $abi, channel: $channel, xcode: $xcode}' \
            > "$RUNNER_TEMP/mobile-release/release.json"
      - name: Save signed binary
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}
          path: |
            ${{ runner.temp }}/mobile-release/*.apk
            ${{ runner.temp }}/mobile-release/*.aab
            ${{ runner.temp }}/mobile-release/*.ipa
          if-no-files-found: error
          retention-days: ${{ inputs.format == 'apk' && 14 || 90 }}
      - name: Archive release manifest, fingerprint, symbols and mappings
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}-evidence
          path: |
            ${{ runner.temp }}/mobile-release/
            !${{ runner.temp }}/mobile-release/*.apk
            !${{ runner.temp }}/mobile-release/*.aab
            !${{ runner.temp }}/mobile-release/*.ipa
          if-no-files-found: error
          retention-days: 90
      - name: Summarize build
        run: |
          echo "### $PLATFORM build $MOBILE_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA. Format: $FORMAT. OTA channel: $MOBILE_UPDATE_CHANNEL. Release evidence retained for 90 days." >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: [prepare, build]
    if: inputs.upload && inputs.format == 'store'
    permissions:
      actions: read
      contents: read
    environment: mobile-store
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-12vcpu-macos-latest' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Require successful CI for the exact production commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { requireSuccessfulCI } = await import(`${process.env.GITHUB_WORKSPACE}/tooling/docker/check-ci.mjs`);
            await requireSuccessfulCI({ github, repo: context.repo, sha: context.sha });
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - uses: actions/download-artifact@v8
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}
          path: ${{ runner.temp }}/mobile-release
      - name: Submit production release for store review
        working-directory: tooling/mobile
        env:
          PLATFORM: ${{ matrix.platform }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ matrix.platform == 'android' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || '' }}
          ASC_KEY_ID: ${{ matrix.platform == 'ios' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ matrix.platform == 'ios' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ matrix.platform == 'ios' && secrets.ASC_PRIVATE_KEY || '' }}
        run: |
          node release.ts --upload
          bundle exec fastlane "$PLATFORM" upload
