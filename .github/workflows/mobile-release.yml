name: Mobile release
run-name: Mobile ${{ inputs.task || 'release' }} · ${{ github.ref_name }}

# Every push to main that can change the app builds signed iOS and Android binaries with one shared build number and
# uploads them to TestFlight (internal testers) and Google Play Internal testing. There is no EAS and no OTA update:
# every fix reaches users as a store build. Dispatch reruns the release, or rebuilds the Forme native libraries.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tooling/mobile/**
      - .github/workflows/mobile-release.yml
  workflow_dispatch:
    inputs:
      task:
        description: release uploads store builds (main only); forme-build packages the Forme native libraries; forme-publish also publishes them as a prerelease
        type: choice
        options: [release, forme-build, forme-publish]
        default: release

permissions:
  contents: read

# Queued, never cancelled: each run reads the stores' latest numbers, so runs must upload in order.
concurrency:
  group: mobile-release
  cancel-in-progress: false
  queue: max

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  prepare:
    name: Read store build numbers
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.task == 'release')
    environment: mobile-store
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      build_number: ${{ steps.release.outputs.build_number }}
      version: ${{ steps.version.outputs.version }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
    steps:
      - name: Check out source (Blacksmith)
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - name: Test release lanes and workflow routing
        run: |
          bundle exec ruby tooling/mobile/signing_test.rb
          ruby tooling/mobile/build_test.rb
          ruby tooling/mobile/ios_build_test.rb
          ruby tooling/mobile/distribution_test.rb
      - name: Read app version
        id: version
        run: node tooling/mobile/release.ts --version
      - name: Read latest store build numbers
        id: store
        working-directory: tooling/mobile
        env:
          PLATFORM: all
          VERSION: ${{ steps.version.outputs.version }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          node release.ts --store
          bundle exec fastlane store_build_numbers version:"$VERSION"
      - name: Allocate build number
        id: release
        env:
          IOS_BUILD_NUMBER: ${{ steps.store.outputs.ios }}
          ANDROID_VERSION_CODE: ${{ steps.store.outputs.android }}
        run: node tooling/mobile/release.ts --prepare
      - name: Summarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.store.outputs.ios }}
          ANDROID_VERSION_CODE: ${{ steps.store.outputs.android }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          echo "### Version $VERSION, build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest on TestFlight: $IOS_BUILD_NUMBER. Highest on Google Play: $ANDROID_VERSION_CODE. Commit: $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    environment: mobile-signing
    strategy:
      # Both stores get the same number, so a failed platform stops the other and nothing uploads.
      fail-fast: true
      matrix:
        platform: [android, ios]
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-12vcpu-macos-latest' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      PLATFORM: ${{ matrix.platform }}
      APP_VARIANT: production
      MOBILE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
    steps:
      - name: Check out source (Blacksmith)
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - name: Set up Java
        uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: matrix.platform == 'android'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 ndk;28.2.13676358 cmake;3.22.1
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_BASE64 || '' }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_PASSWORD || '' }}
          IOS_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_PROVISION_PROFILE_BASE64 || '' }}
          IOS_SHARE_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_SHARE_PROVISION_PROFILE_BASE64 || '' }}
        run: node tooling/mobile/release.ts --signing
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test mobile app
        run: |
          pnpm --filter mobile typecheck
          pnpm --filter mobile test:ci
      - name: Test iOS pending-share lifecycle without signing
        if: matrix.platform == 'ios'
        run: |
          swiftc apps/mobile/node_modules/expo-sharing/ios/shared/Constants.swift \
            apps/mobile/node_modules/expo-sharing/ios/shared/ShareProtocol.swift \
            apps/mobile/node_modules/expo-sharing/ios/shared/PendingPosting.swift \
            tooling/mobile/incoming_share_test.swift -o "$RUNNER_TEMP/incoming-share-test"
          "$RUNNER_TEMP/incoming-share-test"
      - name: Fetch reviewed Forme binaries
        run: node packages/forme-native/scripts/fetch-prebuilt.mjs --platform "$PLATFORM"
      - name: Generate native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform "$PLATFORM" --clean --no-install
      - name: Build signed binary
        working-directory: tooling/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_BASE64 || '' }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ matrix.platform == 'ios' && secrets.IOS_DISTRIBUTION_P12_PASSWORD || '' }}
          IOS_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_PROVISION_PROFILE_BASE64 || '' }}
          IOS_SHARE_PROVISION_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_SHARE_PROVISION_PROFILE_BASE64 || '' }}
        run: bundle exec fastlane "$PLATFORM" build
      - name: Record release manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg platform "$PLATFORM" --arg version "$VERSION" --arg build "$MOBILE_BUILD_NUMBER" \
            --arg xcode "$(if [[ "$PLATFORM" == ios ]]; then xcodebuild -version; fi)" \
            '{commit: $sha, platform: $platform, version: $version, buildNumber: $build, xcode: $xcode}' \
            > "$RUNNER_TEMP/mobile-release/release.json"
      - name: Upload signed binary
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}
          path: |
            ${{ runner.temp }}/mobile-release/*.aab
            ${{ runner.temp }}/mobile-release/*.ipa
          if-no-files-found: error
          retention-days: 90
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}-evidence
          path: |
            ${{ runner.temp }}/mobile-release/
            !${{ runner.temp }}/mobile-release/*.aab
            !${{ runner.temp }}/mobile-release/*.ipa
          if-no-files-found: error
          retention-days: 90

  upload:
    name: Upload ${{ matrix.platform == 'ios' && 'to TestFlight' || 'to Play Internal testing' }}
    needs: [prepare, build]
    # Runs only after both builds succeeded, and never from another branch.
    if: github.ref == 'refs/heads/main'
    environment: mobile-store
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-12vcpu-macos-latest' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
    steps:
      - name: Check out source (Blacksmith)
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - name: Download signed binary
        uses: actions/download-artifact@v8
        with:
          name: mobile-${{ matrix.platform }}-${{ needs.prepare.outputs.build_number }}
          path: ${{ runner.temp }}/mobile-release
      - name: Upload signed binary
        working-directory: tooling/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ matrix.platform == 'android' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || '' }}
          ASC_KEY_ID: ${{ matrix.platform == 'ios' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ matrix.platform == 'ios' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ matrix.platform == 'ios' && secrets.ASC_PRIVATE_KEY || '' }}
        run: |
          node release.ts --store
          bundle exec fastlane "$PLATFORM" upload

  # Forme native libraries: releases never use this job's output. They fetch the archive pinned in the reviewed
  # packages/forme-native/scripts/prebuilt.json; a rebuilt archive is used only after its manifest is committed.
  forme-build:
    name: Build Forme native binaries
    if: github.event_name == 'workflow_dispatch' && inputs.task != 'release'
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.artifact.outputs.tag }}
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ndk;28.2.13676358
      - name: Install pinned Rust toolchain and tools
        working-directory: packages/forme-native/rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal \
            --target aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo install cbindgen --version 0.29.4 --locked
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build native binaries and verify notices and headers
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash packages/forme-native/rust/build.sh
          node packages/forme-native/scripts/notices.mjs
          git diff --exit-code -- packages/forme-native/THIRD_PARTY_NOTICES.md packages/forme-native/ios/include/forme_native.h
      - name: Package content-addressed native binaries
        id: artifact
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download
        run: |
          node packages/forme-native/scripts/artifact.mjs pack "$RUNNER_TEMP/forme-native" "$RELEASE_BASE" > "$RUNNER_TEMP/forme-native-build.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const build = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/forme-native-build.json`));
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${build.tag}\narchive=${build.archive}\nmanifest=${build.manifest}\n`);
          JS
      - name: Verify native binaries can be fetched without Cargo
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const manifest = JSON.parse(readFileSync(process.env.MANIFEST));
          const build = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/forme-native-build.json`));
          manifest.artifacts[0].url = pathToFileURL(build.archive).href;
          writeFileSync(`${process.env.RUNNER_TEMP}/local-prebuilt.json`, JSON.stringify(manifest));
          JS
          node_bin="$(command -v node)"
          PATH=/usr/bin:/bin "$node_bin" packages/forme-native/scripts/fetch-prebuilt.mjs --platform android --manifest "$RUNNER_TEMP/local-prebuilt.json"
          PATH=/usr/bin:/bin "$node_bin" packages/forme-native/scripts/fetch-prebuilt.mjs --platform ios --manifest "$RUNNER_TEMP/local-prebuilt.json"
      - name: Upload native binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.tag }}
          path: ${{ runner.temp }}/forme-native/
          if-no-files-found: error
          retention-days: 30

  forme-publish:
    name: Publish Forme native binaries
    needs: forme-build
    if: inputs.task == 'forme-publish'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download native binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.forme-build.outputs.tag }}
          path: ${{ runner.temp }}/forme-native
      - name: Publish immutable native binary assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.forme-build.outputs.tag }}
          ARTIFACT_DIR: ${{ runner.temp }}/forme-native
        run: |
          gh release create "$TAG" "$ARTIFACT_DIR/$TAG.tar.gz" "$ARTIFACT_DIR/prebuilt.json" --target "$GITHUB_SHA" --title "$TAG" --notes "Native Forme binaries. Review and commit prebuilt.json before building mobile apps." --prerelease
