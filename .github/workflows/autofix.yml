name: autofix.ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autofix:
    name: Apply autofixes
    timeout-minutes: 20
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-32vcpu-ubuntu-2404' || 'ubuntu-latest' }}

    steps:
      - name: Check out source
        if: ${{ vars.USE_BLACKSMITH != 'true' }}
        uses: actions/checkout@v7

      - name: Check out source (Blacksmith)
        if: ${{ vars.USE_BLACKSMITH == 'true' }}
        uses: useblacksmith/checkout@v1

      - name: Check for merge conflict markers
        run: |
          if git grep -nEI '<{7} |>{7} |^={7}$' -- ':(exclude)*.md' ':(exclude)*.mdx'; then
            echo "::error::Merge conflict markers found in tracked files"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Knip fixes
        run: pnpm knip --fix

      # Re-extract catalogs so strings merged without extraction (here or on main) are fixed, not left to fail CI.
      - name: Extract translation catalogs
        run: pnpm lingui:extract

      - name: Generate PDF translations, lint, and format
        run: pnpm check

      - name: Publish autofixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
