name: Mobile Android APK

# Mirrors each Google Play production release to a GitHub release as the universal APK Play generates from the
# uploaded bundle. Play signs it with the app-signing key, so it installs and updates alongside Play Store installs.
# Play sends no event when a release is promoted, so this polls; a release already mirrored is skipped.
on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-android-apk
  cancel-in-progress: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  mirror:
    name: Mirror Play production APK
    if: github.ref == 'refs/heads/main'
    environment: mobile-store
    # A free hosted runner: almost every run only reads the production track.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/mobile/Gemfile
      GH_TOKEN: ${{ github.token }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/mobile
      - name: Read production release
        id: play
        working-directory: tooling/mobile
        run: bundle exec fastlane android production_release
      - name: Check for an existing mirror
        id: mirror
        if: steps.play.outputs.version_code
        env:
          VERSION_CODE: ${{ steps.play.outputs.version_code }}
        run: |
          tag="android-$VERSION_CODE"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already on GitHub."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download universal APK
        if: steps.mirror.outputs.missing
        working-directory: tooling/mobile
        env:
          VERSION_CODE: ${{ steps.play.outputs.version_code }}
        run: bundle exec fastlane android universal_apk version_code:"$VERSION_CODE"
      - name: Publish GitHub release
        if: steps.mirror.outputs.missing
        env:
          TAG: ${{ steps.mirror.outputs.tag }}
          VERSION_CODE: ${{ steps.play.outputs.version_code }}
          VERSION_NAME: ${{ steps.play.outputs.version_name }}
        run: |
          # Tag the commit Mobile release built this version code from (its artifacts last 90 days), else main.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mobile-android-$VERSION_CODE&per_page=1" \
            --jq '.artifacts[0].workflow_run.head_sha // empty')
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && label="$VERSION_NAME-$VERSION_CODE" || label="$VERSION_CODE"
          apk="$RUNNER_TEMP/reactive-resume-android-$label.apk"
          mv "$RUNNER_TEMP/mobile-release/ReactiveResume.apk" "$apk"
          notes="The same build as the Google Play production release, as one universal APK signed by Google Play. It updates a Play Store install, and the Play Store can update it."
          gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --target "${sha:-main}" --latest=false \
            --title "Android ${VERSION_NAME:-build} ($VERSION_CODE)" --notes "$notes"
          echo "Published $TAG from ${sha:-main}." >> "$GITHUB_STEP_SUMMARY"
