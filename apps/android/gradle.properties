# Several agents build worktrees at once on a 32 GB machine: keep each build modest.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon (no second JVM per checkout) and release idle daemons after 10 minutes.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
