# D1 · Empty: an account with no documents says "Import or create a resume" with New, which opens D3.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/T2-FirstRun?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- openLink: me.rxresu.storyboard://documents
- extendedWaitUntil:
    visible: Import or create a resume
    timeout: 10000
- tapOn:
    text: New
    index: 1
- waitForAnimationToEnd
- assertVisible: Import a resume
