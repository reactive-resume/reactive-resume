# P2 · ATS checker, signed out: Choose a PDF opens the document picker; a readable PDF gets a score and plays
# success; a password-protected PDF and one over 25 MB each say so.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/P2-ATS?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- tapOn:
    id: ats-choose
- waitForAnimationToEnd
- runFlow:
    file: lib/pick-file.yaml
    env:
      FILE: q1-resume, pdf
- extendedWaitUntil:
    visible: ".*checks passed.*"
    timeout: 30000
- assertVisible:
    id: haptic-log
    text: success
- tapOn: Choose another PDF
- waitForAnimationToEnd
- runFlow:
    file: lib/pick-file.yaml
    env:
      FILE: q1-locked, pdf
- extendedWaitUntil:
    visible: This PDF is password protected. Save an unprotected copy and try again.
    timeout: 30000
- tapOn: Try again
- waitForAnimationToEnd
- runFlow:
    file: lib/pick-file.yaml
    env:
      FILE: q1-huge, pdf
- extendedWaitUntil:
    visible: That file is too large to check. PDFs up to 25 MB work.
    timeout: 30000
