# T1 · Today: a Needs-you row opens its screen; swiping it toward the start marks it done with Undo.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Open briefing
    timeout: 30000
- tapOn:
    id: today-needs-fieldnote
- waitForAnimationToEnd
- assertVisible: Messages
- tapOn:
    id: top-bar-back
- waitForAnimationToEnd
- assertVisible:
    id: today-needs-fieldnote
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- swipe:
    start: "85%,64%"
    end: "20%,64%"
    duration: 400
    waitToSettleTimeoutMs: 1
- extendedWaitUntil:
    visible: Marked done
    timeout: 5000
- assertNotVisible:
    id: today-needs-fieldnote
# Let the toast finish rising before tapping its Undo.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: Undo
    waitToSettleTimeoutMs: 1
- assertVisible:
    id: haptic-log
    text: light
- extendedWaitUntil:
    visible:
      id: today-needs-fieldnote
    timeout: 5000
