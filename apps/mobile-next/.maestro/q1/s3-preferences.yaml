# S3 · Preferences: the theme changes at once and plays selection; turning a notification category on the first time
# asks for the system permission; the Haptics switch plays toggleOn when turned back on.
appId: me.rxresu.storyboard
---
# Maestro grants every permission at launch on Android unless told otherwise; the prompt is what this proves.
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- openLink: me.rxresu.storyboard://storyboard/S3-Preferences?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- tapOn: Dark
- waitForAnimationToEnd
- assertVisible:
    text: Dark
    selected: true
- assertVisible:
    id: haptic-log
    text: selection
- tapOn: Light
- waitForAnimationToEnd
- tapOn: New roles
- waitForAnimationToEnd
- tapOn: New roles
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: '.*(Would Like to Send You Notifications|to send you notifications\?)'
    timeout: 10000
- tapOn:
    text: Allow
    optional: true
- waitForAnimationToEnd
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- tapOn: Haptics
- waitForAnimationToEnd
- tapOn: Haptics
- waitForAnimationToEnd
# Off plays toggleOff before haptics stop; on plays toggleOn once they're back.
- assertVisible:
    id: haptic-log
    text: toggleOff toggleOn
