# Authoring only. Pinch and end-to-end scroll verification need lead completion; see README. No performance claim from this YAML alone.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/D1-Library?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
# Storyboard capture temporarily sets timeScale=0; lead must wait for capture completion + 4 s before measurements.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: document-resume-lead
      - assertVisible: Sections
      - tapOn:
          id: top-bar-back
- longPressOn:
    id: document-resume-lead
- assertVisible: Move to Trash
- swipe:
    start: 50%, 50%
    end: 50%, 90%
    duration: 500
- assertNotVisible: Move to Trash
- tapOn: Today
- scrollUntilVisible:
    element: Pick up where you left off
    direction: DOWN
- scrollUntilVisible:
    element: Open briefing
    direction: UP
- tapOn: Documents
- tapOn: Applications
- scrollUntilVisible:
    element: Kiln Studio
    direction: DOWN
- scrollUntilVisible:
    element: Lumen
    direction: UP
- tapOn: Career
- openLink: me.rxresu.storyboard://storyboard/B8-Layout?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- assertVisible: Fit to one page
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 36, 335
          end: 36, 463
          duration: 1500
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "108,1005"
          end: "108,1389"
          duration: 1500
- openLink: me.rxresu.storyboard://storyboard/B18-Preview?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- assertVisible: Page 1 of 1
# No two-finger pinch command authored; the fetched command docs did not establish supported syntax. Lead must pinch here during manual recording.
- doubleTapOn:
    point: 50%, 40%
- tapOn: Fit
- openLink: me.rxresu.storyboard://storyboard/D1-Library?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- swipe:
    start: 85%, 22%
    end: 25%, 22%
    duration: 400
- assertVisible: “Product designer” moved to Trash
