# Clean storyboard sandbox required. Uses real request guard, repeats same kind, changes fake key, requests again. File/audio also need native picker/microphone setup; see README.
appId: me.rxresu.storyboard
---
- openLink: me.rxresu.storyboard://storyboard/B16-Assistant?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/B16-Assistant?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- tapOn: Ask about this resume…
- inputText: Help improve this summary
- tapOn: Send
- assertVisible: Send to Work OpenAI?
- assertVisible: "Don't ask again for chats"
- tapOn:
    id: first-send-send
- assertNotVisible: Send to Work OpenAI?
- openLink: me.rxresu.storyboard://builder/resume-product/assistant
- tapOn: Ask about this resume…
- inputText: Help improve this summary
- tapOn: Send
- assertNotVisible: Send to Work OpenAI?
- openLink: me.rxresu.storyboard://settings/ai/providers/work-openai
- tapOn: API key
- inputText: storyboard-replacement-key
- hideKeyboard
- tapOn:
    id: provider-save
- openLink: me.rxresu.storyboard://builder/resume-product/assistant
- tapOn: Ask about this resume…
- inputText: Help improve this summary
- tapOn: Send
- assertVisible: Send to Work OpenAI?
