# J2: a Saved card held 500 ms lifts (`medium`); held at the board's end edge it pages (`selection` per column);
# dropped over a new column it moves there (`rigid` and "Moved to …"). The swipe is slow so the card holds still
# long enough to lift, and ends just inside the 48 dp edge zone.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/J2-KilnSaved?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- assertVisible: "Kiln Studio.*"
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 156, 320
          end: 352, 322
          duration: 11000
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "468,960"
          end: "1056,966"
          duration: 11000
# The swipe's end hold varies by a few hundred ms, so the board may page once or twice: `selection` per page.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: haptic-log
            text: "medium (selection )+rigid"
          timeout: 10000
      - assertVisible: "Moved to .*\\."
# Android's drag pages only once and lands on Applied, whose gate holds the drop (and its `rigid`) until confirmed:
# lift and paging are proved here, the drop by the gate opening.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: haptic-log
            text: "medium selection"
          timeout: 10000
      - assertVisible: What did you send?
