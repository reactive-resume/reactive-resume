appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/D1-Library?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- assertVisible: Product designer
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- swipe:
    start: "85%,22%"
    end: "25%,22%"
    duration: 400
    waitToSettleTimeoutMs: 1
- assertVisible: “Product designer” moved to Trash
- assertVisible: Undo
- assertVisible:
    id: haptic-log
    text: light
- tapOn:
    text: Undo
    waitToSettleTimeoutMs: 1
- assertVisible: Product designer
