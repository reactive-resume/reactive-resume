appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/B18-Preview?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 30000
- assertVisible: Page 1 of 1
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
# B18: Fit snaps a zoomed page back with `selection`. Zoomed with the bar's + here: Maestro's double tap reaches the
# page's gesture only some of the time, so the double-tap snap is proved in src/ui/page-zoom.test.tsx instead.
- tapOn: Zoom in
- waitForAnimationToEnd
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- tapOn: Fit
- assertVisible:
    id: haptic-log
    text: selection
