# B16 · A question card's answer becomes the next message; tapping a context chip removes it and the dashed chip
# brings it back; "Review 3 edits" opens the proposals (B17); the first chat to a connection asks first (S7), then
# the answer is sent.
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/B16-Assistant?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- waitForAnimationToEnd
- tapOn: Yes, I led it
- assertVisible:
    id: composer-input
    text: Yes, I led it
- tapOn: Review 3 edits
- extendedWaitUntil:
    visible: Proposed edits
    timeout: 10000
- tapOn:
    id: top-bar-back
- extendedWaitUntil:
    visible: Review 3 edits
    timeout: 10000
- tapOn: Send
- extendedWaitUntil:
    visible: Send to Work OpenAI?
    timeout: 10000
- tapOn:
    id: first-send-send
# The resume and the posting go too: that kind is asked once as well. The answer is sent (the failure card is
# q6/b16-assistant.yaml's `preset=fail`).
- tapOn:
    id: first-send-send
    optional: true
- extendedWaitUntil:
    notVisible:
      id: composer-input
      text: Yes, I led it
    timeout: 10000
