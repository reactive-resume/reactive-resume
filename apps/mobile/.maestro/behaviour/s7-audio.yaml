# Clean storyboard sandbox required. Uses real request guard, repeats same kind, changes fake key, requests again. Needs microphone permission: xcrun simctl privacy <udid> grant microphone me.rxresu.storyboard.
appId: me.rxresu.storyboard
---
- openLink: me.rxresu.storyboard://storyboard/W4-Practice?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/W4-Practice?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
# The W4 board is drawn mid-recording; practise from an idle screen.
- openLink: me.rxresu.storyboard://applications/lumen/practise
- tapOn: Start recording
- extendedWaitUntil:
    visible: "0?0:0[1-9] / 0?2:00"
    timeout: 10000
- waitForAnimationToEnd
# Stopping a take sends it (W4: Finish is only for a paused take).
- tapOn: Stop recording
- assertVisible: Send to Work OpenAI?
- assertVisible: "Don't ask again for recordings"
- tapOn:
    id: first-send-send
- assertNotVisible: Send to Work OpenAI?
# The take gets its feedback card; Practice again brings the recorder back.
- extendedWaitUntil:
    visible: Practice again
    timeout: 20000
- tapOn: Practice again
- tapOn: Start recording
- extendedWaitUntil:
    visible: "0?0:0[1-9] / 0?2:00"
    timeout: 10000
- waitForAnimationToEnd
# Stopping a take sends it (W4: Finish is only for a paused take).
- tapOn: Stop recording
- assertNotVisible: Send to Work OpenAI?
# The take gets its feedback card; Practice again brings the recorder back.
- extendedWaitUntil:
    visible: Practice again
    timeout: 20000
- tapOn: Practice again
- openLink: me.rxresu.storyboard://settings/ai/providers/work-openai
- tapOn:
    id: provider-key
- inputText: storyboard-replacement-key
- hideKeyboard
- tapOn:
    id: provider-save
- openLink: me.rxresu.storyboard://applications/lumen/practise
- tapOn: Start recording
- extendedWaitUntil:
    visible: "0?0:0[1-9] / 0?2:00"
    timeout: 10000
- waitForAnimationToEnd
# Stopping a take sends it (W4: Finish is only for a paused take).
- tapOn: Stop recording
- assertVisible: Send to Work OpenAI?
