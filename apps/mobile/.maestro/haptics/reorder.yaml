# B8: drag a section down two slots by its handle → "medium selection selection rigid".
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/B8-Layout?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- extendedWaitUntil:
    visible: Fit to one page
    timeout: 15000
- waitForAnimationToEnd
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
# Summary's handle (24, 322) to two rows (64 dp each) lower.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 36, 335
          end: 36, 463
          duration: 1500
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "108,1005"
          end: "108,1389"
          duration: 1500
- extendedWaitUntil:
    visible:
      id: haptic-log
      text: medium selection selection rigid
    timeout: 5000
- waitForAnimationToEnd
