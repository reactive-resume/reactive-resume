appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://storyboard/B17-Proposals?theme=light
- extendedWaitUntil:
    visible:
      id: storyboard-ready
    timeout: 90000
- assertVisible: Proposed edits
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- tapOn:
    id: proposal-accept-1
- assertVisible:
    id: haptic-log
    text: light
