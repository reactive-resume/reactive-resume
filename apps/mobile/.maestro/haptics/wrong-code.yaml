# A3: a wrong two-step code clears the boxes, says so and plays `error` (MOTION.md §5, §12).
appId: me.rxresu.storyboard
---
- launchApp:
    clearState: true
- openLink: me.rxresu.storyboard://dev/haptics?overlay=1&clear=1
- waitForAnimationToEnd
- openLink: me.rxresu.storyboard://two-step
- tapOn:
    id: two-step-code
- inputText: "000000"
- extendedWaitUntil:
    visible: "That code doesn't match. Check it and try again."
    timeout: 5000
- waitForAnimationToEnd
- assertVisible:
    id: haptic-log
    text: error
