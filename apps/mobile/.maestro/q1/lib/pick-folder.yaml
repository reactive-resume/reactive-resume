# Chooses a destination in the system folder picker: On My iPhone on iOS, Documents on Android
# (q1/lib/files.sh creates it).
appId: me.rxresu.storyboard
---
- runFlow:
    when:
      platform: iOS
    file: pick-folder-ios.yaml
- runFlow:
    when:
      platform: Android
    file: pick-folder-android.yaml
